name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 pytest pytest-cov
        # Install project requirements if any, or just install main dependencies
        pip install pandas langchain-text-splitters sentence-transformers lancedb tqdm

    - name: Check code formatting with Black
      run: |
        black scripts src tests

    - name: Check imports with isort
      run: |
        isort scripts src tests

    - name: Lint with flake8
      run: |
        flake8 scripts src tests --max-line-length=120 --exit-zero

    - name: Run Unit Tests with pytest
      run: |
        pytest tests/ --cov=scripts --cov=src --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
