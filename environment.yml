name: trag
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
    - torch==2.5.1
    - lancedb>=0.6.0
    - sentence-transformers>=2.7.0
    - rank-bm25>=0.2.2
    - pydantic>=2.0.0
    - typer>=0.12.0
    - pytest>=8.0.0
    - pandas>=2.2.0
    - pyarrow>=15.0.0
    - scikit-learn>=1.4.0
    - tqdm>=4.66.0
    - ipykernel>=6.0.0
    - llama-index
    - llama-index-embeddings-huggingface
    # Core RAG dependencies
    - langchain-text-splitters>=0.2.0
    # CI/CD and Formatting Tools
    - black
    - isort
    - flake8
    - pytest-cov
    # Data Generation & ML Model dependencies
    - requests
    - python-dotenv
    - joblib
    - cuml-cu12
